name: 🚀 Release Automático com Tradução

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      # 1️⃣ Checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Rodar Release Please
      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node
          path: .
          target-branch: develop       # ← branch que vai receber o PR
      
      # 4️⃣ Traduzir e Limpar CHANGELOG.md (NOVO PASSO)
  # Este passo só roda se o Release Please criou um novo release (verificação com 'release_created')
      - name: Translate and Clean Changelog
        id: translate
        if: ${{ steps.release.outputs.release_created }}
        run: |
          # Verifica se a chave da API está configurada
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY (ou GEMINI_API_KEY) not set. Skipping changelog translation."
            exit 0
          fi

          # Salva o script Node.js para execução
          # Este script usa o modelo DeepSeek para tradução e inclui a lógica 
          # de retentativa (backoff exponencial) e a limpeza de links.
          cat << 'EOF' > translate_changelog.js
          import * as fs from 'fs/promises';
          import { existsSync } from 'fs';

          // --- CONFIGURAÇÃO DEEPSEEK ---
          const MODEL_NAME = 'deepseek-chat';
          const API_KEY = process.env.GEMINI_API_KEY; // Usa a chave da variável de ambiente existente
          const API_URL = 'https://api.deepseek.com/v1/chat/completions'; // Endpoint DeepSeek
          const CHANGELOG_PATH = 'CHANGELOG.md';
          // ----------------------------

          /**
          * Tenta fazer a chamada da API com retentativas e backoff exponencial.
          */
          async function fetchWithRetry(url, options, retries = 5, delay = 1000) {
              for (let i = 0; i < retries; i++) {
                  try {
                      const response = await fetch(url, options);
                      if (response.ok) {
                          return response;
                      }
                      // Para erros de rate limit (429) ou erro interno (5xx), tenta novamente
                      if ((response.status === 429 || response.status >= 500) && i < retries - 1) {
                          console.log(`API Status ${response.status}. Retrying in ${delay}ms...`);
                      } else {
                          // Para outros erros (4xx) ou se for a última retentativa, lança a exceção
                          const errorText = await response.text();
                          throw new Error(`API request failed with status ${response.status}: ${errorText}`);
                      }
                  } catch (error) {
                      if (i === retries - 1) throw error;
                  }
                  await new Promise(resolve => setTimeout(resolve, delay));
                  delay *= 2; // Backoff exponencial
              }
              // unreachable
              throw new Error("Maximum retries reached for API call.");
          }


          /**
          * Limpa links de Markdown que o modelo pode ter deixado, especialmente os de commit/PR.
          */
          function cleanTranslatedText(text) {
              // 1. Remove links de commit e PR que parecem com ' ([#123](...)) ([abc1234](...))'
              // Este é o formato mais comum que o release-please gera.
              let cleanedText = text.replace(/\s*\(\[[\w#]+\]\(.*?\)\)/g, '');
              
              // 2. Remove qualquer outro link de markdown [text](url) -> mantendo apenas 'text'
              cleanedText = cleanedText.replace(/\[([^\]]+)\]\((.*?)\)/g, '$1');

              return cleanedText.trim();
          }

          async function translateChangelog() {
              if (!existsSync(CHANGELOG_PATH)) {
                  console.log(`${CHANGELOG_PATH} not found. Skipping translation.`);
                  return;
              }

              let content;
              try {
                  content = await fs.readFile(CHANGELOG_PATH, 'utf-8');
              } catch (error) {
                  console.error("Error reading CHANGELOG.md:", error);
                  return;
              }

              if (!content || !API_KEY) {
                  console.log("No content or API Key missing. Skipping translation.");
                  return;
              }

              // System Prompt: Tradução técnica, mantendo Markdown, removendo todos os links.
              const systemPrompt = "Você é um tradutor técnico e deve traduzir o texto do CHANGELOG.md para o Português do Brasil. Mantenha toda a estrutura Markdown (cabeçalhos, listas, etc.) exatamente como está. Você DEVE remover todos os links (tanto de commit, pull request, quanto quaisquer outros), mantendo apenas o texto âncora. Não adicione nenhuma saudação, introdução ou conclusão. Responda apenas com o conteúdo traduzido.";

              // Payload para o DeepSeek (formato Chat Completions)
              const payload = {
                  model: MODEL_NAME,
                  messages: [
                      { role: "system", content: systemPrompt },
                      { role: "user", content: content }
                  ],
                  // Usamos temperatura 0 para traduções mais determinísticas
                  temperature: 0.0
              };

              console.log("Starting translation via DeepSeek API...");

              try {
                  const response = await fetchWithRetry(API_URL, {
                      method: 'POST',
                      headers: { 
                          'Content-Type': 'application/json',
                          'Authorization': `Bearer ${API_KEY}` // Chave de API no header
                      },
                      body: JSON.stringify(payload)
                  });

                  const result = await response.json();
                  // A resposta do DeepSeek é parseada como 'choices[0].message.content'
                  const translatedPart = result.choices?.[0]?.message?.content;

                  if (!translatedPart) {
                      console.error("DeepSeek API did not return translated text:", JSON.stringify(result, null, 2));
                      return;
                  }

                  let finalContent = cleanTranslatedText(translatedPart);

                  await fs.writeFile(CHANGELOG_PATH, finalContent, 'utf-8');
                  console.log(`Successfully translated and updated ${CHANGELOG_PATH}.`);
                  // Indica que houve uma tradução (e, portanto, uma alteração)
                  console.log("translation_done=true" >> $GITHUB_OUTPUT);

              } catch (error) {
                  console.error("Failed to translate changelog:", error);
              }
          }

          translateChangelog();
          EOF
          
          # Executa o script Node.js
          node translate_changelog.js

      # 5️⃣ Commit do CHANGELOG traduzido e Push para Branch Temporária
      # NOVO PASSO: Cria a branch, commita a tradução e faz o push da nova branch.
      - name: Commit and Push Translation Branch
        id: commit_push
        if: ${{ steps.release.outputs.release_created && steps.translate.outputs.translation_done == 'true' }}
        run: |
          # Define a nova branch baseada no ID do workflow run para evitar colisões
          TRANSLATION_BRANCH="chore/translate-changelog-${{ github.run_id }}"
          echo "translation_branch=$TRANSLATION_BRANCH" >> $GITHUB_OUTPUT
          
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          
          # Cria e faz checkout da nova branch
          git checkout -b $TRANSLATION_BRANCH
          git add CHANGELOG.md
          
          # Verifica se realmente houve alteração (evita commit vazio)
          if git diff --cached --quiet; then
            echo "No effective changes to commit. Skipping PR creation."
            echo "changes_pushed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: Tradução automática do CHANGELOG.md [skip ci]"
            git push origin $TRANSLATION_BRANCH
            echo "Pushed changes to $TRANSLATION_BRANCH"
            echo "changes_pushed=true" >> $GITHUB_OUTPUT
          fi

      # 6️⃣ Abrir Pull Request para a tradução
      # NOVO PASSO: Abre um PR da branch temporária para a develop.
      - name: Create Translation Pull Request
        if: ${{ steps.release.outputs.release_created && steps.commit_push.outputs.changes_pushed == 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Usa a branch criada no passo anterior
          branch: ${{ steps.commit_push.outputs.translation_branch }}
          base: develop
          title: "chore: Tradução automática do CHANGELOG.md"
          body: |
            Este PR contém a tradução automática do CHANGELOG.md para Português do Brasil, 
            realizada pelo DeepSeek, e a remoção dos links de commit/PR.
            
            Por favor, revise e mescle (merge).
          labels: |
            automation
            translation
