name: 🚀 Release Automático com Tradução

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest

    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      # 1️⃣ Checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Rodar Release Please
      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node
          path: .
          target-branch: develop       # ← branch que vai receber o PR
      
      
      # 4️⃣ Instalar dependências para tradução
      - name: Instalar dependências
        run: npm install openai

      # 5️⃣ Traduzir CHANGELOG.md com DeepSeek via lib OpenAI
      - name: Traduzir CHANGELOG.md
        run: |
          node -e "
            import fs from 'fs';
            import OpenAI from 'openai';

            const apiKey = process.env.DEEPSEEK_API_KEY;
            if (!apiKey) throw new Error('❌ DEEPSEEK_API_KEY não definida.');

            const client = new OpenAI({
              apiKey,
              baseURL: 'https://api.deepseek.com/openai/v1',
            });

            const changelogPath = 'CHANGELOG.md';
            const changelog = fs.readFileSync(changelogPath, 'utf8');

            // 🔹 Remove links de commits e ajusta título de versão
            const cleaned = changelog
              .replace(/\\*\\([^)]*\\)\\*/g, '') // remove links tipo ([xxxxxx])
              .replace(/## \\[(.*?)\\]\\([^)]*\\)/g, '## $1'); // deixa ## 1.10.0 (data)

            const system_role = 'Você é um tradutor técnico. Traduza o changelog para português, mantendo a formatação Markdown e removendo textos irrelevantes dos commits.';
            const prompt = 'Traduza o seguinte changelog para português, mantendo estrutura e datas:\\n\\n' + cleaned;

            (async () => {
              try {
                const completion = await client.chat.completions.create({
                  model: 'deepseek-reasoner',
                  messages: [
                    { role: 'system', content: system_role },
                    { role: 'user', content: prompt },
                  ],
                });

                const translated = completion.choices[0].message.content;
                fs.writeFileSync(changelogPath, translated);
                console.log('✅ Tradução concluída e salva em CHANGELOG.md');
              } catch (err) {
                console.error('❌ Erro ao traduzir:', err);
                process.exit(1);
              }
            })();
          "

      # 5️⃣ Criar um novo PR com a tradução
      - name: Criar Pull Request para tradução
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: traduzir-changelog
          base: develop
          title: "📝 Tradução do CHANGELOG para Português"
          body: "Este PR adiciona o arquivo **CHANGELOG-PTBR.md** traduzido automaticamente usando a IA do DeepSeek."
          commit-message: "chore: adicionar CHANGELOG traduzido para PT-BR"
          add-paths: CHANGELOG-PTBR.md