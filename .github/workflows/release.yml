name: 🚀 Release Automático com Tradução

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest

    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      # 1️⃣ Checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Rodar Release Please
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node
          path: .
          target-branch: develop       # ← branch que vai receber o PR
      
      
      # 4️⃣ Traduzir CHANGELOG.md para PT-BR com DeepSeek API
      - name: Traduzir CHANGELOG.md com DeepSeek
        if: steps.release.outputs.release_created == 'true'
        run: |
          echo "🔍 Verificando arquivo CHANGELOG.md"
          if [ ! -f CHANGELOG.md ]; then
            echo "❌ Arquivo CHANGELOG.md não encontrado!"
            exit 1
          fi

          echo "📘 Instalando dependências..."
          npm install axios

          echo "🧠 Traduzindo conteúdo via DeepSeek..."
          node <<'EOF'
          import fs from "fs";
          import axios from "axios";

          const apiKey = process.env.DEEPSEEK_API_KEY;
          const changelog = fs.readFileSync("CHANGELOG.md", "utf8");

          // 🔧 Remove links de commits e também os links das versões
          const cleanMarkdown = (text) => {
            return text
              // remove links de commits
              .replace(/\(\[.*?\]\(https:\/\/github\.com\/[^\)]+\)\)/g, "")
              // remove link das versões (ex: ## [1.10.0](https://...) → ## 1.10.0)
              .replace(/## \[(.*?)\]\(https:\/\/[^\)]+\)/g, "## $1");
          };

          const system_role = `
            Você é um assistente de tradução especializado em converter textos técnicos e changelogs de software para o português do Brasil.
            Mantenha a formatação Markdown original, mas remova quaisquer links de commits e links de versões.
            Garanta que o texto traduzido seja claro, conciso e adequado para desenvolvedores brasileiros.
          `;

          const prompt = `
          Traduza o seguinte changelog para o português do Brasil, mantendo a formatação Markdown.
          Remova também os links de commits e os links de versão.
          Texto a traduzir:
          ---
          ${changelog}
          `;

          (async () => {
            try {
              const response = await axios.post(
                "https://api.deepseek.com/v1/chat/completions",
                {
                  model: "deepseek-chat",
                  messages: [{ role: "user", content: prompt }, { role: "system", content: system_role }],
                },
                {
                  headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${apiKey}`,
                  },
                }
              );

              const translated = response.data.choices?.[0]?.message?.content || "";
              const cleaned = cleanMarkdown(translated);
              fs.writeFileSync("CHANGELOG-PTBR.md", cleaned);
              console.log("✅ Tradução concluída e salva em CHANGELOG-PTBR.md");
            } catch (err) {
              console.error("❌ Erro ao traduzir:", err.response?.data || err.message);
              process.exit(1);
            }
          })();
          EOF

      # 5️⃣ Criar um novo PR com a tradução
      - name: Criar Pull Request para tradução
        if: steps.release.outputs.release_created == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: traduzir-changelog
          base: develop
          title: "📝 Tradução do CHANGELOG para Português"
          body: "Este PR adiciona o arquivo **CHANGELOG-PTBR.md** traduzido automaticamente usando a IA do DeepSeek."
          commit-message: "chore: adicionar CHANGELOG traduzido para PT-BR"
          add-paths: CHANGELOG-PTBR.md